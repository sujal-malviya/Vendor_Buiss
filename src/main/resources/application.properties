spring.application.name=vendor-onboarding

# Values come from environment variables when set (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET).
# The part after ":" is only a local-development default. Never put real production secrets in this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vendor_onboarding}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway owns the database structure: every change is a new SQL file in src/main/resources/db/migration
# (V3__..., V4__...). Hibernate only CHECKS that the entities match the tables and refuses to start if not.
spring.jpa.hibernate.ddl-auto=validate
# The existing database was created before Flyway: treat it as already being at V1 and only run V2 onwards.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Don't keep a database connection open for the whole HTTP request (it hides lazy-loading bugs and wastes connections).
# Services load everything they need inside the service layer, so this is safe.
spring.jpa.open-in-view=false

server.port=8080

# Lists: ?page=0&size=20&sort=name,asc — nobody may ask for more than 100 rows at once
spring.data.web.pageable.max-page-size=100

# Never send Java stack traces to API clients (devtools turns them on by default).
# Spring Boot 4 name; the old server.error.include-stacktrace is deprecated and no longer takes effect.
spring.web.error.include-stacktrace=never

# Must be at least 32 characters. Set JWT_SECRET to your own random value before going live.
jwt.secret=${JWT_SECRET:replace-this-with-a-long-random-secret-key-min-256-bits}
# FIX: this value is in SECONDS (JwtService uses plusSeconds). 86400 = 1 day.
# The old value 86400000 meant ~1000 days.
jwt.expiration=86400
