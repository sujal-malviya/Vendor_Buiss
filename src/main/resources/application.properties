spring.application.name=vendor-onboarding

spring.datasource.url=jdbc:postgresql://localhost:5432/vendor_onboarding
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Must be at least 32 characters. Replace with your own random value before going live.
jwt.secret=replace-this-with-a-long-random-secret-key-min-256-bits
# FIX: this value is in SECONDS (JwtService uses plusSeconds). 86400 = 1 day.
# The old value 86400000 meant ~1000 days.
jwt.expiration=86400
