# Used only by tests: a throwaway in-memory database, created fresh for every test run
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-secret-key-that-is-at-least-32-characters-long
jwt.expiration=3600

# Same as production, so tests catch lazy-loading problems
spring.jpa.open-in-view=false

# Tests build the in-memory schema from the entities; Flyway migrations are for the real PostgreSQL database
spring.flyway.enabled=false
